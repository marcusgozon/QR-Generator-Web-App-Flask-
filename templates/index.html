<!DOCTYPE html>
<html>
<head>
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body>
    <header class="heading">
        <span class="qr-logo" aria-hidden="true">
            <span class="finder finder-top-left"></span>
            <span class="finder finder-top-right"></span>
            <span class="finder finder-bottom-left"></span>
            <span class="qr-dot"></span>
        </span>
        <h1>Generate QR Code</h1>
        <p>Turn any link into a scannable code.</p>
    </header>
    <form action="/generate_qr" method="post">
        <label>Enter URL:</label>
        <input type="text" name="url" required><br><br>

        <label>File Name:</label>
        <input type="text" name="file_name" placeholder="qr_code.png"><br><br>

        <button type="submit">Generate QR</button>
    </form>
</body>
</html>
